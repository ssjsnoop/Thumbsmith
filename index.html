<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Thumbsmith</title>
<meta name="theme-color" content="#14141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Thumbsmith">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;width:100%;overflow:hidden;background:#14141a;color:#ececf3;font-family:system-ui,-apple-system,Roboto,"Segoe UI",sans-serif;overscroll-behavior:none;position:fixed;inset:0;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{-webkit-user-select:text;user-select:text}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "holder" "ctrl" "tools";padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:#14141a}
#app.land{grid-template-rows:auto minmax(0,1fr);grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"top top top" "tools holder ctrl"}
#top{grid-area:top;display:flex;align-items:center;gap:2px;padding:4px 6px;min-height:50px}
.land #top{min-height:44px;padding:2px 6px}
.grow{flex:1}
#holder{grid-area:holder;position:relative;overflow:hidden;min-height:0;min-width:0;touch-action:none;background:#0d0d11}
#view{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#ctrl{grid-area:ctrl;display:flex;align-items:center;gap:8px;padding:6px 10px}
.land #ctrl{flex-direction:column;width:108px;padding:6px 8px;align-items:stretch}
#sliders{display:flex;flex:1;gap:8px;min-width:0}
.land #sliders{min-height:0}
.ctop{display:flex;gap:6px;align-items:center;justify-content:center}
#tools{grid-area:tools;display:flex;overflow-x:auto;overflow-y:hidden;gap:3px;padding:2px 6px 8px;justify-content:center;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.land #tools{flex-direction:column;overflow-x:hidden;overflow-y:auto;padding:4px 6px;width:58px;justify-content:flex-start}
.ib{flex:0 0 auto;width:44px;height:44px;border:0;background:transparent;color:#dcdce6;border-radius:13px;display:grid;place-items:center;padding:0}
.ib:active{background:#2b2b39}
.ib[disabled]{opacity:.3;pointer-events:none}
.tb{flex:1 1 0;min-width:44px;max-width:60px;height:54px;border:0;background:#1d1d27;color:#cfcfdc;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;padding:0}
.land .tb{flex:0 0 auto;width:46px;height:38px;max-width:none}.land .tb span{display:none}
.tb.on{background:linear-gradient(135deg,#ff7a59,#b84bff);color:#fff}
.tb:active{filter:brightness(1.2)}
#swatch{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:3px solid #fff;background:#111;box-shadow:0 0 0 2px #2b2b39;padding:0}
.sl{position:relative;flex:1;height:44px;border-radius:22px;background:#252531;overflow:hidden;touch-action:none;min-width:0}
.sl .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--f,0)*100%);background:linear-gradient(90deg,#ff7a5999,#b84bff99)}
.sl .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:12px;pointer-events:none;text-shadow:0 1px 2px #0008}
.sl.v{height:auto;width:auto;border-radius:16px}
.sl.v .fill{top:auto;left:0;right:0;bottom:0;width:auto;height:calc(var(--f,0)*100%);background:linear-gradient(0deg,#ff7a5999,#b84bff99)}
.sl.v .lab{font-size:10px;flex-direction:column;padding:10px 0;justify-content:space-between;align-items:center}
.sl.dim{opacity:.35}
#sizeprev{position:absolute;left:50%;top:50%;border-radius:50%;border:2px solid #fff;mix-blend-mode:difference;transform:translate(-50%,-50%);pointer-events:none;display:none}
#loupe{position:absolute;width:64px;height:64px;border-radius:50%;border:4px solid #fff;box-shadow:0 2px 12px #000a;pointer-events:none;display:none}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#000c;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .25s;max-width:90%;text-align:center;z-index:30}
#toast.show{opacity:1}
#floatbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;gap:6px;background:#1e1e29f2;padding:6px;border-radius:18px;box-shadow:0 4px 20px #0009;z-index:20;max-width:96%;flex-wrap:wrap;justify-content:center}
#floatbar[hidden]{display:none}
.fb{border:0;background:#2b2b39;border-radius:13px;padding:0 12px;height:42px;font-size:13px;display:flex;align-items:center;gap:6px}
.fb.ok{background:linear-gradient(135deg,#ff7a59,#b84bff);color:#fff;font-weight:600}
.floating #top,.floating #ctrl,.floating #tools{opacity:.35;pointer-events:none}
#sheetHost{position:fixed;inset:0;pointer-events:none;z-index:50}
.scrim{position:absolute;inset:0;background:#0007;pointer-events:auto;display:flex;align-items:flex-end;justify-content:center}
.scrim.modeless{background:transparent;pointer-events:none}
.sheet{pointer-events:auto;width:min(100%,580px);max-height:82%;background:#1e1e29;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 30px #000a;padding-bottom:env(safe-area-inset-bottom);touch-action:pan-y}
.land .sheet{max-height:96%}
.sh-hd{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 4px 18px;font-size:16px}
.sh-body{overflow-y:auto;padding:4px 16px 18px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.lbl{font-size:12px;color:#9a9ab0;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:0;background:#2b2b39;color:#e5e5ef;border-radius:20px;padding:0 14px;height:38px;font-size:13px}
.chip.on{background:linear-gradient(135deg,#ff7a59,#b84bff);color:#fff}
.btn{border:0;background:#2b2b39;border-radius:14px;height:46px;padding:0 16px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:linear-gradient(135deg,#ff7a59,#b84bff);color:#fff;font-weight:600}
.btn.danger{color:#ff7b7b}
.menu .mi{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;text-align:left;padding:13px 6px;font-size:15px;border-radius:12px}
.menu .mi:active{background:#2b2b39}
.menu .mi svg{flex:0 0 auto;opacity:.85}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw i{display:block;width:34px;height:34px;border-radius:50%;border:2px solid #ffffff30}
.cp{display:flex;flex-direction:column;gap:12px}
.svbox{position:relative;height:160px;border-radius:14px;overflow:hidden;touch-action:none}
.svbox canvas{width:100%;height:100%;display:block}
.knob{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #000a;transform:translate(-50%,-50%);pointer-events:none}
.huebox{position:relative;height:30px;border-radius:15px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);touch-action:none}
.huebox .knob{top:50%}
.hex{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:#2b2b39;color:#fff;padding:0 12px;font-size:16px;font-family:monospace}
.prev{width:44px;height:44px;border-radius:12px;border:2px solid #fff3}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btile{border:2px solid transparent;background:#2b2b39;border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
.btile.on{border-color:#ff7a59}
.btile canvas{width:100%;height:44px}
.lrow{display:flex;align-items:center;gap:8px;padding:6px;border-radius:14px;background:#262633;margin-bottom:6px;border:2px solid transparent}
.lrow.on{border-color:#ff7a59}
.lrow canvas{width:44px;height:44px;border-radius:8px;background:#fff}
.lrow .nm{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow input{flex:1;min-width:0;height:36px;border-radius:8px;border:0;background:#14141a;color:#fff;padding:0 8px;font-size:16px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.gcard{background:#2b2b39;border-radius:14px;overflow:hidden;position:relative;border:0;padding:0;text-align:left}
.gcard img{width:100%;height:130px;object-fit:contain;background:#fff;display:block}
.gcard .cap{padding:6px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .del{position:absolute;right:4px;top:4px;width:34px;height:34px;border-radius:50%;background:#000a;border:0;display:grid;place-items:center}
.gcard.new{display:grid;place-items:center;min-height:160px;color:#ff9b80;font-size:14px;gap:6px}
.sizes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{border:2px solid transparent;background:#2b2b39;border-radius:14px;padding:12px;text-align:left;font-size:13px}
.card.on{border-color:#ff7a59}
.card b{display:block;font-size:14px;margin-bottom:2px}
.card span{color:#9a9ab0;font-size:12px}
input.num{width:84px;height:40px;border-radius:10px;border:0;background:#2b2b39;color:#fff;padding:0 8px;font-size:16px}
.tbox{position:fixed;left:50%;top:12px;transform:translateX(-50%);width:min(94%,520px);background:#1e1e29;border-radius:18px;padding:12px;box-shadow:0 8px 30px #000b;z-index:60;display:flex;flex-direction:column;gap:10px}
.tbox textarea{width:100%;border-radius:12px;border:0;background:#14141a;color:#fff;font-size:18px;padding:10px;resize:none;font-family:inherit}
#textHost:empty{display:none}
.hint{font-size:13px;color:#a6a6ba;line-height:1.5}
.hint b{color:#fff}
select{height:40px;border-radius:10px;border:0;background:#2b2b39;color:#fff;padding:0 8px;font-size:14px}

#games{position:fixed;inset:0;z-index:40;background:#14141a;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);touch-action:none}
#games[hidden],#games [hidden]{display:none!important}
.gtop{display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:52px}
.gtitle{flex:1;font-size:18px;font-weight:600}
.ginfo{font-size:14px;color:#ffb199;padding-right:10px;font-variant-numeric:tabular-nums}
#gHub{flex:1;overflow-y:auto;padding:8px 14px 24px;touch-action:pan-y}
.ghub{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcx{border:0;background:#1f1f2b;border-radius:18px;padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;color:#ececf3;min-height:150px}
.gcx .gi{font-size:34px;line-height:1;background:linear-gradient(135deg,#ff7a59,#b84bff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.gcx b{font-size:16px}.gcx span{font-size:12px;color:#9a9ab0;flex:1}.gcx em{font-style:normal;font-size:12px;color:#ffb199}
.glv{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.glb{border:0;background:#1f1f2b;border-radius:16px;height:84px;color:#ececf3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px}
.glb span{font-size:12px;color:#ffd54f}.glb.lock{opacity:.4;font-size:24px}
#gPlay{flex:1;display:flex;flex-direction:column;min-height:0}
#gStage{flex:1;position:relative;min-height:0}
#gc{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
#gHint{padding:6px 14px 10px;font-size:13px;color:#a6a6ba;text-align:center;min-height:30px}
#gRes{position:absolute;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:3;padding:14px}
.rcard{background:#1e1e29;border-radius:22px;padding:22px 20px;text-align:center;width:min(100%,380px);box-shadow:0 10px 40px #000a}
.rt{font-size:22px;font-weight:700}.rbig{font-size:54px;font-weight:800;margin:6px 0;background:linear-gradient(135deg,#ff7a59,#b84bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.rstars{font-size:34px;color:#ffd54f;letter-spacing:4px}.rsub{font-size:13px;color:#a6a6ba;margin:8px 0 14px;line-height:1.4}
.rbtn{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#gCur{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #000a;pointer-events:none;display:none;z-index:2}
#games button:focus-visible{outline:3px solid #ffd54f;outline-offset:2px}
.gdbg{position:absolute;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:14px}
.gdbox{background:#1e1e29;border-radius:18px;padding:18px;width:min(100%,420px);max-height:90%;overflow:auto}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="ib" id="bMenu" data-ic="menu" aria-label="Menu"></button>
    <button class="ib" id="bUndo" data-ic="undo" aria-label="Undo"></button>
    <button class="ib" id="bRedo" data-ic="redo" aria-label="Redo"></button>
    <div class="grow"></div>
    <button class="ib" id="bFit" data-ic="fit" aria-label="Fit to screen"></button>
    <button class="ib" id="bGames" data-ic="gamepad" aria-label="Drawing games"></button>
    <button class="ib" id="bLayers" data-ic="layers" aria-label="Layers"></button>
    <button class="ib" id="bSave" data-ic="download" aria-label="Save or share"></button>
  </div>
  <div id="holder">
    <canvas id="view"></canvas>
    <div id="sizeprev"></div>
    <div id="loupe"></div>
    <div id="floatbar" hidden></div>
    <div id="toast"></div>
  </div>
  <div id="ctrl">
    <div class="ctop"><button id="swatch" aria-label="Color"></button><button class="ib" id="bOpt" data-ic="sliders" aria-label="Tool options"></button></div>
    <div id="sliders"><div id="slSize"></div><div id="slOp"></div></div>
  </div>
  <div id="tools"></div>
  <div id="sheetHost"></div>
  <div id="textHost"></div>
</div>
<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>

let LID=1;
function newLayer(name){const c=mk(S.W,S.H);return {id:LID++,name:name||('Layer '+LID),canvas:c,ctx:c.getContext('2d'),visible:true,opacity:1,blend:'source-over',dirty:true,blob:null,float:null};}
const stroke={on:false,canvas:null,ctx:null,alpha:1,erase:false,grain:null};
let scratch=null,gcan=null,checker=null;
function ensureBuffers(){
  stroke.canvas=mk(S.W,S.H);stroke.ctx=stroke.canvas.getContext('2d');
  scratch=mk(S.W,S.H);gcan=null;
}
const getG=()=>gcan||(gcan=mk(S.W,S.H));
const grainCache={};
function grainPat(kind){
  if(grainCache[kind])return grainCache[kind];
  const cell=kind==='coarse'?2:1,N=128,c=mk(N,N),x=c.getContext('2d');
  const id=x.createImageData(N,N),d=id.data;
  const thr=kind==='coarse'?.5:.32;
  for(let y=0;y<N;y+=cell)for(let xx=0;xx<N;xx+=cell){
    const n=Math.random();const a=n<thr?0:(.55+.45*n);
    for(let j=0;j<cell;j++)for(let i=0;i<cell;i++){const p=((y+j)*N+(xx+i))*4;d[p]=d[p+1]=d[p+2]=255;d[p+3]=a*255;}
  }
  x.putImageData(id,0,0);
  return grainCache[kind]=x.createPattern(c,'repeat');
}
function strokeSrc(){
  if(!stroke.grain)return stroke.canvas;
  const g=getG(),x=g.getContext('2d');
  x.globalCompositeOperation='source-over';x.globalAlpha=1;x.clearRect(0,0,S.W,S.H);x.drawImage(stroke.canvas,0,0);
  x.globalCompositeOperation='destination-in';x.fillStyle=grainPat(stroke.grain);x.fillRect(0,0,S.W,S.H);x.globalCompositeOperation='source-over';
  return g;
}
function drawFloat(ctx,f){
  ctx.save();ctx.translate(f.cx,f.cy);ctx.rotate(f.r);ctx.scale(f.s*(f.fx?-1:1),f.s);
  ctx.drawImage(f.src,-f.src.width/2,-f.src.height/2);ctx.restore();
}
function paintLayers(ctx,live){
  for(let i=0;i<S.layers.length;i++){
    const L=S.layers[i];if(!L.visible)continue;
    ctx.save();ctx.globalAlpha=L.opacity;ctx.globalCompositeOperation=L.blend;
    if(live&&L.float){drawFloat(ctx,L.float);}
    else if(live&&stroke.on&&i===S.active){
      const sx=scratch.getContext('2d');
      sx.globalCompositeOperation='source-over';sx.globalAlpha=1;sx.clearRect(0,0,S.W,S.H);sx.drawImage(L.canvas,0,0);
      sx.globalAlpha=stroke.alpha;sx.globalCompositeOperation=stroke.erase?'destination-out':'source-over';
      sx.drawImage(strokeSrc(),0,0);sx.globalAlpha=1;sx.globalCompositeOperation='source-over';

    }else ctx.drawImage(L.canvas,0,0);
    ctx.restore();
  }
}
function paintPaper(ctx){

    if(!checker){const c=mk(32,32),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,32,32);x.fillStyle='#d9d9e2';x.fillRect(0,0,16,16);x.fillRect(16,16,16,16);checker=ctx.createPattern(c,'repeat');}
    ctx.fillStyle=checker;

function flatten(transparent){

let sc1=null;
function sampleAt(px,py){
  px=clamp(Math.floor(px),0,S.W-1);py=clamp(Math.floor(py),0,S.H-1);

  const x=sc1;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,1,1);x.setTransform(1,0,0,1,-px,-py);
  x.fillStyle=S.paper==='transparent'?'#fff':S.paper;x.fillRect(px,py,1,1);

}

/* ================= history ================= */
const HI={u:[],r:[],bytes:0};
function pushHist(e){
  e.bytes=e.canvas?e.w*e.h*4:0;HI.u.push(e);HI.bytes+=e.bytes;
  HI.r.forEach(x=>HI.bytes-=x.bytes);HI.r.length=0;
  while(HI.u.length>1&&(HI.bytes>220e6||HI.u.length>90)){const o=HI.u.shift();HI.bytes-=o.bytes;}
  histUI();
}
function pushPx(L,x,y,w,h){
  const c=mk(w,h);c.getContext('2d').drawImage(L.canvas,x,y,w,h,0,0,w,h);
  pushHist({kind:'px',layer:L,x,y,w,h,canvas:c});
}
const pushFn=(undo,redo)=>pushHist({kind:'fn',undo,redo});
function swapPx(e){
  const L=e.layer,cur=mk(e.w,e.h);cur.getContext('2d').drawImage(L.canvas,e.x,e.y,e.w,e.h,0,0,e.w,e.h);
  L.ctx.clearRect(e.x,e.y,e.w,e.h);L.ctx.drawImage(e.canvas,e.x,e.y);e.canvas=cur;L.dirty=true;
}
function undo(){
  if(floatL())return;const e=HI.u.pop();if(!e)return;
  if(e.kind==='px')swapPx(e);else e.undo();
  HI.r.push(e);afterHist();
}
function redo(){
  if(floatL())return;const e=HI.r.pop();if(!e)return;
  if(e.kind==='px')swapPx(e);else e.redo();
  HI.u.push(e);afterHist();
}
function afterHist(){S.active=clamp(S.active,0,S.layers.length-1);histUI();scheduleSave();rq();if(layersOpen)refreshLayers();}
function histUI(){$('#bUndo').disabled=!HI.u.length;$('#bRedo').disabled=!HI.r.length;}
function clearHist(){HI.u=[];HI.r=[];HI.bytes=0;histUI();}
function markDirty(L){L.dirty=true;scheduleSave();}

const BRUSHES={

 ink:{name:'Ink',kind:'round',sp:.05,alpha:1,taper:true},
 pencil:{name:'Pencil',kind:'soft',sp:.07,alpha:.95,hard:.7,flow:1,scale:.55,grain:'fine'},

 airbrush:{name:'Airbrush',kind:'soft',sp:.05,alpha:1,hard:0,flow:.07,hold:true},

};
const BRUSH_ORDER=['pen','ink','pencil','marker','highlighter','crayon','airbrush','watercolor','spray','calligraphy'];

function symList(mode,W,H){
  const id=(x,y)=>[x,y],mv=(x,y)=>[W-x,y],mh=(x,y)=>[x,H-y],mb=(x,y)=>[W-x,H-y];
  if(mode==='v')return [id,mv];if(mode==='h')return [id,mh];if(mode==='quad')return [id,mv,mh,mb];
  if(mode==='r6'||mode==='r8'||mode==='r12'){const n=mode==='r6'?6:mode==='r8'?8:12,cx=W/2,cy=H/2,out=[];
    for(let i=0;i<n;i++){const a=2*Math.PI*i/n,co=Math.cos(a),si=Math.sin(a);out.push((x,y)=>{const dx=x-cx,dy=y-cy;return [cx+dx*co-dy*si,cy+dx*si+dy*co];});}return out;}
  return [id];
}

class Stroker{
  constructor(ctx,id,color,size,o={}){
    this.ctx=ctx;this.id=id;const b=this.b=BRUSHES[id];this.color=color;this.D=Math.max(1,size*(b.scale||1));
    this.syms=o.syms||[(x,y)=>[x,y]];this.smooth=o.smooth||0;this.bounds=null;this.acc=0;this.speed=0;this.m=1;this.pen=false;
    if(b.kind==='soft'){
      const sd=Math.min(512,Math.max(2,Math.ceil(this.D))),c=mk(sd,sd),g=c.getContext('2d'),rgb=hexRgb(color);
      const gr=g.createRadialGradient(sd/2,sd/2,0,sd/2,sd/2,sd/2),h=Math.min(.98,b.hard||0);
      gr.addColorStop(0,`rgba(${rgb},1)`);gr.addColorStop(h,`rgba(${rgb},1)`);gr.addColorStop(1,`rgba(${rgb},0)`);
      g.fillStyle=gr;g.fillRect(0,0,sd,sd);this.sprite=c;
    }
  }
  stamp(x,y,m){
    const b=this.b,c=this.ctx,D=this.D*m,col=this.color;
    for(const f of this.syms){
      let [px,py]=f(x,y);
      switch(b.kind){
        case 'round':c.fillStyle=col;c.beginPath();c.arc(px,py,D/2,0,6.2832);c.fill();break;
        case 'sq':c.fillStyle=col;c.fillRect(px-D/2,py-D/2,D,D);break;
        case 'soft':{const j=b.jit?D*b.jit:0;if(j){px+=(Math.random()-.5)*j*2;py+=(Math.random()-.5)*j*2;}
          c.globalAlpha=b.flow;c.drawImage(this.sprite,px-D/2,py-D/2,D,D);c.globalAlpha=1;break;}
        case 'chisel':c.fillStyle=col;c.save();c.translate(px,py);c.rotate(-.6);c.fillRect(-D/2,-D*.17,D,D*.34);c.restore();break;
        case 'nib':c.fillStyle=col;c.beginPath();c.ellipse(px,py,D/2,D*.13,-.78,0,6.2832);c.fill();break;
        case 'spray':{c.fillStyle=col;const n=clamp(Math.round(D*.3),5,90),ds=Math.max(1,D/80);
          for(let i=0;i<n;i++){const a=Math.random()*6.2832,r=D/2*Math.sqrt(Math.random());c.fillRect(px+Math.cos(a)*r,py+Math.sin(a)*r,ds,ds);}break;}
      }
      const r=D*.75+4,bd=this.bounds||(this.bounds={x0:1e9,y0:1e9,x1:-1e9,y1:-1e9});
      if(px-r<bd.x0)bd.x0=px-r;if(py-r<bd.y0)bd.y0=py-r;if(px+r>bd.x1)bd.x1=px+r;if(py+r>bd.y1)bd.y1=py+r;
    }
  }
  calcM(p){
    if(this.pen&&p)return .2+1.1*p;
    if(this.b.taper)return clamp(1.35-this.speed*.8,.28,1.35);
    return 1;
  }
  begin(x,y,p,t){
    this.sx=this.lx=x;this.sy=this.ly=y;this.lt=t;this.m=this.calcM(p);
    this.stamp(x,y,this.b.taper?1:this.m);this.acc=0;
  }
  moveTo(rx,ry,p,t,force){
    const dt=Math.max(1,t-this.lt);this.lt=t;
    const tau=this.smooth*70,k=(force||tau<=0)?1:1-Math.exp(-dt/tau);
    const nx=this.sx+(rx-this.sx)*k,ny=this.sy+(ry-this.sy)*k;this.sx=nx;this.sy=ny;
    const dx=nx-this.lx,dy=ny-this.ly,dist=Math.hypot(dx,dy);if(dist<.01)return;
    this.speed=this.speed*.75+(dist/dt)*.25;
    const tm=this.calcM(p),step=Math.max(.6,this.D*this.b.sp),ux=dx/dist,uy=dy/dist;
    let rem=dist,pos=0;const m0=this.m;
    while(true){
      const need=step-this.acc;if(need>rem){this.acc+=rem;break;}
      pos+=need;rem-=need;this.acc=0;
      const m=m0+(tm-m0)*(pos/dist);
      this.stamp(this.lx+ux*pos,this.ly+uy*pos,m);
    }
    this.lx=nx;this.ly=ny;this.m=m0+(tm-m0)*.5;
  }
  hold(){this.stamp(this.lx,this.ly,this.m);}
}

/* ================= view / render ================= */
let needR=false;
function rq(){if(!needR){needR=true;requestAnimationFrame(render);}}
const toDoc=(x,y)=>({x:(x-S.view.tx)/S.view.s,y:(y-S.view.ty)/S.view.s});
function fitView(){
  const pad=6;if(!cw||!ch)return;
  const s=Math.min((cw-pad*2)/S.W,(ch-pad*2)/S.H);
  S.view.s=s;S.view.tx=(cw-S.W*s)/2;S.view.ty=(ch-S.H*s)/2;S.minS=s*.4;S.fit=true;rq();
}
function render(){
  needR=false;const d=DPR,V=S.view,ctx=vctx;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#0d0d11';ctx.fillRect(0,0,view.width,view.height);
  ctx.setTransform(d*V.s,0,0,d*V.s,d*V.tx,d*V.ty);
  ctx.imageSmoothingEnabled=V.s*d<2.5;ctx.imageSmoothingQuality='high';
  ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=26*d;ctx.fillStyle='#fff';ctx.fillRect(0,0,S.W,S.H);ctx.restore();
  paintPaper(ctx);
  ctx.save();ctx.beginPath();ctx.rect(0,0,S.W,S.H);ctx.clip();paintLayers(ctx,true);ctx.restore();
  const lw=1.5/V.s;
  if(S.sym!=='off'&&!floatL()&&(S.tool==='brush'||S.tool==='eraser')){
    ctx.save();ctx.strokeStyle='rgba(120,120,255,.55)';ctx.lineWidth=lw;ctx.setLineDash([8/V.s,6/V.s]);ctx.beginPath();
    const cx=S.W/2,cy=S.H/2;
    if(S.sym==='v'||S.sym==='quad'){ctx.moveTo(cx,0);ctx.lineTo(cx,S.H);}
    if(S.sym==='h'||S.sym==='quad'){ctx.moveTo(0,cy);ctx.lineTo(S.W,cy);}
    if(S.sym[0]==='r'){const n=+S.sym.slice(1),R=Math.hypot(S.W,S.H);for(let i=0;i<n;i++){const a=2*Math.PI*i/n;ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);}}
    ctx.stroke();ctx.restore();
  }
  const fl=floatL();
  if(fl){const f=fl.float;ctx.save();ctx.translate(f.cx,f.cy);ctx.rotate(f.r);ctx.scale(f.s,f.s);
    const w=f.src.width,h=f.src.height,q=1/(V.s*f.s);ctx.lineWidth=2*q;ctx.strokeStyle='#fff';ctx.strokeRect(-w/2,-h/2,w,h);
    ctx.setLineDash([8*q,8*q]);ctx.strokeStyle='#000';ctx.strokeRect(-w/2,-h/2,w,h);ctx.restore();}
}
function layout(){
  const land=app.clientWidth>app.clientHeight;
  app.classList.toggle('land',land);
  $$('.sl').forEach(s=>s.classList.toggle('v',land));
  const w=holder.clientWidth,h=holder.clientHeight;
  if(w<20||h<20){setTimeout(layout,120);return;}
  const first=!cw,oc=cw?toDoc(cw/2,ch/2):null;
  DPR=Math.min(3,window.devicePixelRatio||1);
  const bw=Math.round(w*DPR),bh=Math.round(h*DPR);
  if(view.width!==bw||view.height!==bh){view.width=bw;view.height=bh;}
  cw=w;ch=h;
  if(first||S.fit)fitView();
  else if(oc){S.view.tx=cw/2-oc.x*S.view.s;S.view.ty=ch/2-oc.y*S.view.s;S.minS=Math.min((cw-12)/S.W,(ch-12)/S.H)*.4;}
  rq();
}
let layT=[];
function relayout(){layout();layT.forEach(clearTimeout);layT=[80,300,800].map(ms=>setTimeout(layout,ms));}
window.addEventListener('resize',relayout);
window.addEventListener('orientationchange',relayout);
if(window.visualViewport)visualViewport.addEventListener('resize',relayout);
if(screen.orientation&&screen.orientation.addEventListener)screen.orientation.addEventListener('change',relayout);
window.addEventListener('pageshow',relayout);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')relayout();else saveNow();});
document.addEventListener('fullscreenchange',relayout);
if(window.ResizeObserver)new ResizeObserver(()=>layout()).observe(holder);

/* ================= floating (photo / text / move) ================= */
let floatLayer=null;
const floatL=()=>floatLayer;
function showFloatBar(kind){
  const b=$('#floatbar');b.hidden=false;app.classList.add('floating');
  let h=`<button class="fb" data-a="cancel">${ic('x',18)}Cancel</button>`;
  if(kind==='photo')h+=`<button class="fb" data-a="fit">Fit</button><button class="fb" data-a="fill">Fill</button>`;
  if(kind!=='text')h+=`<button class="fb" data-a="rot">${ic('rotate',18)}90°</button><button class="fb" data-a="flip">${ic('flip',18)}Flip</button>`;
  if(kind==='move')h+=`<button class="fb" data-a="reset">Reset</button>`;
  h+=`<button class="fb ok" data-a="ok">${ic('check',18)}Done</button>`;
  b.innerHTML=h;
}
$('#floatbar').addEventListener('click',e=>{
  const a=e.target.closest('button');if(!a||!floatLayer)return;const f=floatLayer.float;
  switch(a.dataset.a){
    case 'ok':commitFloat();break;
    case 'cancel':cancelFloat();break;
    case 'fit':f.s=Math.min(S.W/f.src.width,S.H/f.src.height);f.cx=S.W/2;f.cy=S.H/2;f.r=0;break;
    case 'fill':f.s=Math.max(S.W/f.src.width,S.H/f.src.height);f.cx=S.W/2;f.cy=S.H/2;f.r=0;break;
    case 'rot':f.r+=Math.PI/2;break;
    case 'flip':f.fx=!f.fx;break;
    case 'reset':f.s=1;f.cx=S.W/2;f.cy=S.H/2;f.r=0;f.fx=false;break;
  }
  rq();
});
function startFloat(kind,src,opts={}){
  if(floatLayer)cancelFloat();
  let L;
  if(kind==='move'){L=S.layers[S.active];L.float={kind,src,cx:S.W/2,cy:S.H/2,s:1,r:0,fx:false};}
  else{
    L=newLayer(kind==='photo'?'Photo':'Text');S.layers.splice(S.active+1,0,L);S.floatPrevActive=S.active;S.active++;
    L.float={kind,src,cx:opts.cx??S.W/2,cy:opts.cy??S.H/2,s:opts.s??1,r:0,fx:false};
  }
  floatLayer=L;showFloatBar(kind);rq();if(layersOpen)refreshLayers();
}
function cancelFloat(){
  const L=floatLayer;if(!L)return;const f=L.float;
  if(f.kind!=='move'){const i=S.layers.indexOf(L);if(i>=0)S.layers.splice(i,1);S.active=clamp(S.floatPrevActive??0,0,S.layers.length-1);}
  L.float=null;floatLayer=null;endFloatUI();rq();if(layersOpen)refreshLayers();
}
function endFloatUI(){$('#floatbar').hidden=true;app.classList.remove('floating');if(S.tool==='move')setTool(S.prevTool==='move'?'brush':S.prevTool);}
function commitFloat(){
  const L=floatLayer;if(!L)return;const f=L.float;

/* ================= pointer handling ================= */
const ptrs=new Map();let gest=null,op=null,stk=null,holdT=0,spaceDown=false;
const rectOf=()=>view.getBoundingClientRect();
function docPt(p){return toDoc(p.x,p.y);}
function ensureWritable(){
  const L=S.layers[S.active];

  if(!L.visible){toast('This layer is hidden');return null;}
  return L;
}
view.addEventListener('pointerdown',e=>{
  e.preventDefault();

});
view.addEventListener('pointermove',e=>{

  if(ptrs.size===1){
    if(floatLayer){const nx=e.clientX-r.left,ny=e.clientY-r.top,f=floatLayer.float;f.cx+=(nx-p.x)/S.view.s;f.cy+=(ny-p.y)/S.view.s;p.x=nx;p.y=ny;rq();return;}
    if(p.dead||!op){p.x=e.clientX-r.left;p.y=e.clientY-r.top;return;}

});
function endPtr(e,cancelled){
  const p=ptrs.get(e.pointerId);if(!p)return;

  if(ptrs.size===1){

    ptrs.delete(e.pointerId);
  }else{
    if(gest&&!gest.moved&&e.timeStamp-gest.t0<320&&!floatLayer&&!cancelled){undo();toast('Undo',700);}

view.addEventListener('pointerup',e=>endPtr(e,false));

view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('wheel',e=>{
  e.preventDefault();const r=rectOf(),k=e.deltaY<0?1.12:1/1.12;zoomAt(e.clientX-r.left,e.clientY-r.top,k);
},{passive:false});
function zoomAt(x,y,k){
  const V=S.view,ns=clamp(V.s*k,S.minS,40),dp=toDoc(x,y);V.s=ns;V.tx=x-dp.x*ns;V.ty=y-dp.y*ns;S.fit=false;rq();
}
function startGesture(){

}
function updateGesture(){
  const [a,b]=[...ptrs.values()];
  const ncx=(a.x+b.x)/2,ncy=(a.y+b.y)/2,nd=Math.hypot(a.x-b.x,a.y-b.y)||1,na=Math.atan2(b.y-a.y,b.x-a.x);

    const f=floatLayer.float,pp=toDoc(gest.cx,gest.cy),pn=toDoc(ncx,ncy);
    let da=na-gest.a;
    const vx=f.cx-pp.x,vy=f.cy-pp.y,co=Math.cos(da),si=Math.sin(da);

/* ---- tools ---- */
function startTool(p,e){
  const dp=docPt(p);
  switch(S.tool){
    case 'brush':case 'eraser':{
      const L=ensureWritable();if(!L)return;
      const er=isEr(),id=er?'eraser':S.brush,b=BRUSHES[id];
      stroke.on=true;stroke.erase=er;stroke.alpha=(er?1:b.alpha)*getOp();stroke.grain=er?null:(b.grain||null);
      stk=new Stroker(stroke.ctx,id,er?'#000':S.color,getSize(),{syms:symList(S.sym,S.W,S.H),smooth:S.smooth});
      stk.pen=e.pointerType==='pen';
      stk.begin(dp.x,dp.y,e.pointerType==='pen'&&e.pressure>0?e.pressure:0,e.timeStamp);
      op={type:'stroke'};
      if(b.hold){clearInterval(holdT);holdT=setInterval(()=>{if(stk&&stroke.on){stk.hold();rq();}},45);}
      rq();break;}
    case 'shape':{
      const L=ensureWritable();if(!L)return;
      op={type:'shape',x0:dp.x,y0:dp.y,x1:dp.x,y1:dp.y,prev:null};break;}
    case 'fill':op={type:'fill',x:dp.x,y:dp.y,sx:p.x,sy:p.y,ok:true};break;
    case 'pick':op={type:'pick'};showLoupe(p,dp);break;
    case 'text':op={type:'text',x:dp.x,y:dp.y,sx:p.x,sy:p.y,ok:true};break;
    case 'move':break;
  }
}
function moveTool(p,ev){
  const dp=docPt(p);
  if(!op)return;
  switch(op.type){
    case 'stroke':stk.moveTo(dp.x,dp.y,stk.pen&&ev.pressure>0?ev.pressure:0,ev.timeStamp);rq();break;
    case 'shape':op.x1=dp.x;op.y1=dp.y;drawShapePreview();break;
    case 'fill':case 'text':if(Math.hypot(p.x-op.sx,p.y-op.sy)>14)op.ok=false;break;
    case 'pick':showLoupe(p,dp);break;
  }
}
function endTool(p,e){
  const dp=docPt(p);
  switch(op.type){
    case 'stroke':{const r=stk;r.moveTo(dp.x,dp.y,r.pen&&e.pressure>0?e.pressure:0,e.timeStamp+1,true);commitStroke();break;}
    case 'shape':op.x1=dp.x;op.y1=dp.y;drawShapePreview();commitStroke();break;
    case 'fill':if(op.ok)doFill(op.x,op.y);break;
    case 'text':if(op.ok)openText(op.x,op.y);break;
    case 'pick':{hideLoupe();const x=dp.x,y=dp.y;if(x>=0&&y>=0&&x<S.W&&y<S.H){setColor(sampleAt(x,y),true);}setTool(S.prevTool&&S.prevTool!=='pick'?S.prevTool:'brush');break;}
  }

}
function cancelTool(){
  if(!op)return;

  if(op.type==='pick')hideLoupe();
  clearInterval(holdT);op=null;stk=null;rq();
}
function clearStrokeBuf(){
  stroke.on=false;clearInterval(holdT);
  stroke.ctx.clearRect(0,0,S.W,S.H);stroke.bounds=null;
}
function commitStroke(){
  clearInterval(holdT);
  const L=S.layers[S.active];let b=stk?stk.bounds:(op&&op.bounds);
  if(op&&op.type==='shape')b=op.bounds;
  stroke.on=false;
  if(L&&b){
    const x=Math.max(0,Math.floor(b.x0)),y=Math.max(0,Math.floor(b.y0)),x2=Math.min(S.W,Math.ceil(b.x1)),y2=Math.min(S.H,Math.ceil(b.y1)),w=x2-x,h=y2-y;
    if(w>0&&h>0){
      pushPx(L,x,y,w,h);
      const src=strokeSrc();
      L.ctx.save();L.ctx.globalAlpha=stroke.alpha;L.ctx.globalCompositeOperation=stroke.erase?'destination-out':'source-over';
      L.ctx.drawImage(src,x,y,w,h,x,y,w,h);L.ctx.restore();
      stroke.ctx.clearRect(x,y,w,h);markDirty(L);
    }
  }
  stroke.ctx.clearRect(0,0,S.W,S.H);
  stk=null;stroke.grain=null;rq();
}

/* ---- shapes ---- */
const SHAPES=[['line','╱ Line'],['arrow','➜ Arrow'],['rect','▭ Rectangle'],['rrect','▢ Rounded'],['ellipse','◯ Ellipse'],['tri','△ Triangle'],['diamond','◇ Diamond'],['star','★ Star'],['heart','♥ Heart']];
function shapePath(c,type,x0,y0,x1,y1,lock,lw){

  const x=Math.min(x0,x0+dx),y=Math.min(y0,y0+dy),w=Math.abs(dx),h=Math.abs(dy);
  c.beginPath();

    case 'line':c.moveTo(x0,y0);c.lineTo(x1,y1);break;
    case 'arrow':{c.moveTo(x0,y0);c.lineTo(x1,y1);const a=Math.atan2(y1-y0,x1-x0),hl=Math.max(lw*3,26);
      c.moveTo(x1,y1);c.lineTo(x1-hl*Math.cos(a-.5),y1-hl*Math.sin(a-.5));c.moveTo(x1,y1);c.lineTo(x1-hl*Math.cos(a+.5),y1-hl*Math.sin(a+.5));break;}
    case 'rect':c.rect(x,y,w,h);break;
    case 'rrect':{const r=Math.min(w,h)*.22;c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();break;}
    case 'ellipse':c.ellipse(x+w/2,y+h/2,Math.max(.5,w/2),Math.max(.5,h/2),0,0,6.2832);break;
    case 'tri':c.moveTo(x+w/2,y);c.lineTo(x+w,y+h);c.lineTo(x,y+h);c.closePath();break;
    case 'diamond':c.moveTo(x+w/2,y);c.lineTo(x+w,y+h/2);c.lineTo(x+w/2,y+h);c.lineTo(x,y+h/2);c.closePath();break;
    case 'star':{const cx=x+w/2,cy=y+h/2;for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,k=i%2?.42:1;const px=cx+Math.cos(a)*w/2*k,py=cy+Math.sin(a)*h/2*k;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();break;}

function drawShapePreview(){
  const c=stroke.ctx;c.clearRect(0,0,S.W,S.H);

  if(filled){c.fill();c.stroke();}else c.stroke();
  const pad=lw+30,m=op;m.bounds={x0:Math.min(m.x0,m.x1)-pad,y0:Math.min(m.y0,m.y1)-pad,x1:Math.max(m.x0,m.x1)+pad,y1:Math.max(m.y0,m.y1)+pad};
  if(S.lock){const d=Math.max(Math.abs(m.x1-m.x0),Math.abs(m.y1-m.y0));m.bounds={x0:Math.min(m.x0,m.x0-d)-pad,y0:Math.min(m.y0,m.y0-d)-pad,x1:Math.max(m.x0,m.x0+d)+pad,y1:Math.max(m.y0,m.y0+d)+pad};}

/* ---- flood fill ---- */
function doFill(x,y){
  const L=ensureWritable();if(!L)return;
  x=Math.floor(x);y=Math.floor(y);if(x<0||y<0||x>=S.W||y>=S.H)return;
  const W=S.W,H=S.H;
  const srcCanvas=S.fillSample==='all'?flatten(false):L.canvas;
  const sctx=srcCanvas.getContext('2d',{willReadFrequently:true});
  const data=sctx.getImageData(0,0,W,H).data;
  const i0=(y*W+x)*4,tr=data[i0],tg=data[i0+1],tb=data[i0+2],ta=data[i0+3],tol=S.fillTol;
  const match=i=>Math.max(Math.abs(data[i]-tr),Math.abs(data[i+1]-tg),Math.abs(data[i+2]-tb),Math.abs(data[i+3]-ta))<=tol;
  const mask=new Uint8Array(W*H);const stack=[x,y];
  let bx0=x,bx1=x,by0=y,by1=y;
  while(stack.length){
    const yy=stack.pop(),xx=stack.pop();let row=yy*W;
    if(mask[row+xx]||!match((row+xx)*4))continue;
    let a=xx,b=xx;
    while(a>0&&!mask[row+a-1]&&match((row+a-1)*4))a--;
    while(b<W-1&&!mask[row+b+1]&&match((row+b+1)*4))b++;
    for(let k=a;k<=b;k++)mask[row+k]=1;
    if(a<bx0)bx0=a;if(b>bx1)bx1=b;if(yy<by0)by0=yy;if(yy>by1)by1=yy;
    for(const dy of [-1,1]){
      const ny=yy+dy;if(ny<0||ny>=H)continue;const nr=ny*W;let inSpan=false;
      for(let k=a;k<=b;k++){const ok=!mask[nr+k]&&match((nr+k)*4);if(ok&&!inSpan){stack.push(k,ny);inSpan=true;}else if(!ok)inSpan=false;}
    }
  }
  const grow=S.fillGrow;
  if(grow>0){
    const gt=tol*3+40;
    const near=i=>Math.max(Math.abs(data[i]-tr),Math.abs(data[i+1]-tg),Math.abs(data[i+2]-tb),Math.abs(data[i+3]-ta))<=gt;
    for(let it=0;it<grow;it++){
      const add=[];
      const ya=Math.max(0,by0-1),yb=Math.min(H-1,by1+1),xa=Math.max(0,bx0-1),xb=Math.min(W-1,bx1+1);
      for(let yy=ya;yy<=yb;yy++)for(let xx=xa;xx<=xb;xx++){
        const i=yy*W+xx;if(mask[i])continue;
        if((xx>0&&mask[i-1])||(xx<W-1&&mask[i+1])||(yy>0&&mask[i-W])||(yy<H-1&&mask[i+W])){if(near(i*4))add.push(i);}
      }
      for(const i of add){mask[i]=1;const xx=i%W,yy=(i/W)|0;if(xx<bx0)bx0=xx;if(xx>bx1)bx1=xx;if(yy<by0)by0=yy;if(yy>by1)by1=yy;}
      if(!add.length)break;
    }
  }
  const bw=bx1-bx0+1,bh=by1-by0+1;if(bw<=0||bh<=0)return;
  const out=new ImageData(bw,bh),od=out.data,[cr,cg,cb]=hexRgbA(S.color);
  for(let yy=0;yy<bh;yy++){const mr=(by0+yy)*W+bx0;for(let xx=0;xx<bw;xx++){if(mask[mr+xx]){const p=(yy*bw+xx)*4;od[p]=cr;od[p+1]=cg;od[p+2]=cb;od[p+3]=255;}}}
  const tmp=mk(bw,bh);tmp.getContext('2d').putImageData(out,0,0);
  pushPx(L,bx0,by0,bw,bh);
  L.ctx.save();L.ctx.globalAlpha=S.op;L.ctx.drawImage(tmp,bx0,by0);L.ctx.restore();
  markDirty(L);rq();
}

/* ---- text ---- */
const FONTS={sans:['Sans','system-ui,Roboto,Arial,sans-serif'],serif:['Serif','Georgia,"Times New Roman",serif'],mono:['Mono','ui-monospace,Menlo,Consolas,monospace'],hand:['Hand','"Comic Sans MS","Segoe Print","Bradley Hand",cursive'],bold:['Impact','Impact,Haettenschweiler,"Arial Black",sans-serif']};
function openText(x,y){
  const host=$('#textHost');
  host.innerHTML=`<div class="tbox"><textarea rows="2" placeholder="Type your text…"></textarea><div class="row" id="fchips"></div><div class="row"><button class="btn" id="tCancel">Cancel</button><div class="grow"></div><button class="btn pri" id="tOk">Add text</button></div></div>`;
  const ta=$('textarea',host),fc=$('#fchips',host);
  const paint=()=>{fc.innerHTML='';
    for(const k in FONTS){const b=el('button','chip'+(S.font===k?' on':''),'Aa');b.style.fontFamily=FONTS[k][1];b.title=FONTS[k][0];b.onclick=()=>{S.font=k;saveSet();paint();ta.style.fontFamily=FONTS[k][1];};fc.appendChild(b);}
    const bb=el('button','chip'+(S.bold?' on':''),'<b>B</b>');bb.onclick=()=>{S.bold=!S.bold;saveSet();paint();};fc.appendChild(bb);
    const ib=el('button','chip'+(S.italic?' on':''),'<i>I</i>');ib.onclick=()=>{S.italic=!S.italic;paint();};fc.appendChild(ib);};

    const m=mk(8,8).getContext('2d');m.font=font;let w=0;lines.forEach(l=>w=Math.max(w,m.measureText(l).width));
    const lh=px*1.2,pad=px*.3,c=mk(Math.ceil(w+pad*2),Math.ceil(lines.length*lh+pad*2)),g=c.getContext('2d');
    g.font=font;g.fillStyle=S.color;g.textBaseline='top';lines.forEach((l,i)=>g.fillText(l,pad,pad+i*lh+px*.08));

}

/* ================= UI: sliders, tools, buttons ================= */
const painters=[];
function slider(host,o){
  host.classList.add('sl');
  host.innerHTML=`<div class="fill"></div><div class="lab"><span>${o.label}</span><span class="vv"></span></div>`;
  const vv=$('.vv',host);let drag=false;
  const paint=()=>{host.style.setProperty('--f',o.get());vv.textContent=o.fmt(o.get());host.classList.toggle('dim',!!(o.dim&&o.dim()));};
  const ev=e=>{const r=host.getBoundingClientRect(),v=host.classList.contains('v');return clamp(v?1-(e.clientY-r.top)/r.height:(e.clientX-r.left)/r.width,0,1);};
  host.addEventListener('pointerdown',e=>{e.preventDefault();drag=true;host.setPointerCapture(e.pointerId);o.set(ev(e));paint();o.start&&o.start();});
  host.addEventListener('pointermove',e=>{if(!drag)return;o.set(ev(e));paint();o.move&&o.move();});
  const up=()=>{if(!drag)return;drag=false;o.end&&o.end();};
  host.addEventListener('pointerup',up);host.addEventListener('pointercancel',up);
  painters.push(paint);paint();return paint;
}
const repaintSliders=()=>painters.forEach(p=>p());

let sheet=null,layersOpen=false;
function closeSheet(){
  if(!sheet)return;const s=sheet;sheet=null;layersOpen=false;s.scrim.remove();s.onClose&&s.onClose();
}
function openSheet(title,build,o={}){
  closeSheet();
  const scrim=el('div','scrim'+(o.modeless?' modeless':''));
  const sh=el('div','sheet'+(o.cls?' '+o.cls:'')),hd=el('div','sh-hd');

    body.innerHTML=`<div class="cp"><div class="svbox"><canvas width="256" height="160"></canvas><div class="knob" id="svk"></div></div><div class="huebox"><div class="knob" id="hk"></div></div></div>

    const refresh=(commit)=>{

    const svEv=e=>{const r=sv.getBoundingClientRect();s=clamp((e.clientX-r.left)/r.width,0,1);v=1-clamp((e.clientY-r.top)/r.height,0,1);refresh(false);};
    let d1=false,d2=false;
    sv.addEventListener('pointerdown',e=>{d1=true;sv.setPointerCapture(e.pointerId);svEv(e);});
    sv.addEventListener('pointermove',e=>{if(d1)svEv(e);});
    sv.addEventListener('pointerup',()=>{if(d1){d1=false;refresh(true);}});
    const hEv=e=>{const r=hb.getBoundingClientRect();h=clamp((e.clientX-r.left)/r.width,0,1)*360;drawSV();refresh(false);};
    hb.addEventListener('pointerdown',e=>{d2=true;hb.setPointerCapture(e.pointerId);hEv(e);});
    hb.addEventListener('pointermove',e=>{if(d2)hEv(e);});

function drawBrushPreview(cv,id){
  const x=cv.getContext('2d'),b=BRUSHES[id];x.clearRect(0,0,cv.width,cv.height);
  const st=new Stroker(x,id,'#f2f2f8',id==='spray'?42:id==='highlighter'||id==='watercolor'||id==='airbrush'?32:id==='crayon'||id==='marker'?20:14,{smooth:0});
  x.globalAlpha=b.alpha;
  // draw to a temp so alpha doesn't stack
  const tmp=mk(cv.width,cv.height),tx=tmp.getContext('2d');st.ctx=tx;
  const pts=[];for(let i=0;i<=40;i++){const t=i/40;pts.push([22+t*(cv.width-44),cv.height/2+Math.sin(t*6.2)*18]);}
  let tm=0;st.begin(pts[0][0],pts[0][1],0,0);
  for(let i=1;i<pts.length;i++){tm+=(id==='ink'?(i<20?16:5):8);st.moveTo(pts[i][0],pts[i][1],0,tm,true);}
  if(b.grain){tx.globalCompositeOperation='destination-in';tx.fillStyle=grainPat(b.grain);tx.fillRect(0,0,cv.width,cv.height);}
  x.globalAlpha=b.alpha;x.drawImage(tmp,0,0);x.globalAlpha=1;
}

/* ---- layers ---- */
function thumbCanvas(L){
  const c=mk(88,88),x=c.getContext('2d'),k=Math.min(88/S.W,88/S.H),w=S.W*k,h=S.H*k,ox=(88-w)/2,oy=(88-h)/2;
  x.fillStyle=S.paper==='transparent'?'#eee':S.paper;x.fillRect(ox,oy,w,h);
  x.imageSmoothingQuality='high';
  if(L.float)x.drawImage(L.float.src,ox,oy,w,h);else x.drawImage(L.canvas,ox,oy,w,h);return c;
}
function openLayers(){
  openSheet('Layers',body=>{layersOpen=true;buildLayers(body);},{modeless:true,onClose:()=>{layersOpen=false;}});
  layersOpen=true;
}
function refreshLayers(){const b=sheet&&$('.sh-body',sheet.scrim);if(b&&layersOpen)buildLayers(b);}
const BLENDS=[['source-over','Normal'],['multiply','Multiply'],['screen','Screen'],['overlay','Overlay'],['darken','Darken'],['lighten','Lighten']];
function buildLayers(body){
  body.innerHTML='';
  const list=el('div');body.appendChild(list);
  for(let i=S.layers.length-1;i>=0;i--){
    const L=S.layers[i],row=el('div','lrow'+(i===S.active?' on':''));
    const th=thumbCanvas(L);th.style.cssText='width:44px;height:44px;border-radius:8px;background:#fff';row.appendChild(th);
    const nm=el('div','nm',L.name);row.appendChild(nm);
    const eye=el('button','ib',ic(L.visible?'eye':'eyeoff',20));eye.onclick=e=>{e.stopPropagation();L.visible=!L.visible;markDirty(L);rq();buildLayers(body);};row.appendChild(eye);
    row.onclick=()=>{if(floatLayer)return;if(S.active===i){const inp=el('input');inp.value=L.name;nm.replaceWith(inp);inp.focus();inp.select();const done=()=>{L.name=inp.value.trim()||L.name;markDirty(L);buildLayers(body);};inp.onblur=done;inp.onkeydown=e=>{if(e.key==='Enter')inp.blur();};inp.onclick=e=>e.stopPropagation();}else{S.active=i;buildLayers(body);}};
    list.appendChild(row);
  }
  const L=S.layers[S.active];
  const act=el('div','row');act.style.marginTop='10px';
  const B=(icon,label,fn,cls='')=>{const b=el('button','chip '+cls,ic(icon,16)+' '+label);b.style.display='inline-flex';b.style.alignItems='center';b.style.gap='6px';b.onclick=fn;return b;};
  act.appendChild(B('plus','New',()=>layerAdd()));
  act.appendChild(B('copy','Duplicate',()=>layerDup()));
  act.appendChild(B('merge','Merge down',()=>layerMerge()));
  act.appendChild(B('up','Up',()=>layerMove(1)));
  act.appendChild(B('down','Down',()=>layerMove(-1)));
  act.appendChild(B('eraser','Clear',()=>layerClear()));
  act.appendChild(B('trash','Delete',()=>layerDelete()));
  body.appendChild(act);
  body.appendChild(el('div','lbl','Selected layer'));
  body.appendChild(miniSlider('Opacity',()=>L.opacity,f=>{L.opacity=Math.round(f*100)/100;markDirty(L);rq();},()=>Math.round(L.opacity*100)+'%'));
  const br=el('div','row');br.style.marginTop='8px';
  const sel=el('select');BLENDS.forEach(([k,n])=>{const o=el('option','',n);o.value=k;if(L.blend===k)o.selected=true;sel.appendChild(o);});
  sel.onchange=()=>{L.blend=sel.value;markDirty(L);rq();};br.appendChild(el('span','hint','Blend'));br.appendChild(sel);body.appendChild(br);
}
const maxLayers=()=>clamp(Math.floor(160e6/(S.W*S.H)),3,16);
function layerAdd(){
  if(S.layers.length>=maxLayers()){toast('Layer limit reached');return;}
  const N=newLayer('Layer '+(S.layers.length+1)),idx=S.active+1,prev=S.active;
  S.layers.splice(idx,0,N);S.active=idx;
  pushFn(()=>{const k=S.layers.indexOf(N);if(k>=0)S.layers.splice(k,1);S.active=prev;},()=>{S.layers.splice(idx,0,N);S.active=idx;});
  markDirty(N);rq();refreshLayers();
}
function layerDup(){
  if(S.layers.length>=maxLayers()){toast('Layer limit reached');return;}
  const src=S.layers[S.active],N=newLayer(src.name+' copy');N.ctx.drawImage(src.canvas,0,0);N.opacity=src.opacity;N.blend=src.blend;
  const idx=S.active+1,prev=S.active;S.layers.splice(idx,0,N);S.active=idx;
  pushFn(()=>{const k=S.layers.indexOf(N);if(k>=0)S.layers.splice(k,1);S.active=prev;},()=>{S.layers.splice(idx,0,N);S.active=idx;});
  markDirty(N);rq();refreshLayers();
}
function layerDelete(){
  if(S.layers.length<=1){toast('Need at least one layer');return;}
  const idx=S.active,L=S.layers[idx];S.layers.splice(idx,1);S.active=Math.min(idx,S.layers.length-1);const na=S.active;
  pushFn(()=>{S.layers.splice(idx,0,L);S.active=idx;},()=>{const k=S.layers.indexOf(L);if(k>=0)S.layers.splice(k,1);S.active=na;});
  scheduleSave();rq();refreshLayers();
}
function layerClear(){const L=S.layers[S.active];pushPx(L,0,0,S.W,S.H);L.ctx.clearRect(0,0,S.W,S.H);markDirty(L);rq();refreshLayers();}
function layerMove(dir){
  const i=S.active,j=i+dir;if(j<0||j>=S.layers.length)return;
  const swap=(a,b)=>{const t=S.layers[a];S.layers[a]=S.layers[b];S.layers[b]=t;};
  swap(i,j);S.active=j;
  pushFn(()=>{swap(i,j);S.active=i;},()=>{swap(i,j);S.active=j;});scheduleSave();rq();refreshLayers();
}
function layerMerge(){
  const i=S.active;if(i<=0){toast('Nothing below to merge into');return;}
  const U=S.layers[i],D=S.layers[i-1],before=mk(S.W,S.H);before.getContext('2d').drawImage(D.canvas,0,0);
  const doMerge=()=>{D.ctx.save();D.ctx.globalAlpha=U.opacity;D.ctx.globalCompositeOperation=U.blend;if(U.visible)D.ctx.drawImage(U.canvas,0,0);D.ctx.restore();D.dirty=true;};
  const after=mk(S.W,S.H);
  doMerge();after.getContext('2d').drawImage(D.canvas,0,0);S.layers.splice(i,1);S.active=i-1;
  pushFn(()=>{D.ctx.clearRect(0,0,S.W,S.H);D.ctx.drawImage(before,0,0);D.dirty=true;S.layers.splice(i,0,U);S.active=i;},
         ()=>{D.ctx.clearRect(0,0,S.W,S.H);D.ctx.drawImage(after,0,0);D.dirty=true;const k=S.layers.indexOf(U);if(k>=0)S.layers.splice(k,1);S.active=i-1;});
  HI.u[HI.u.length-1].bytes=S.W*S.H*8;HI.bytes+=S.W*S.H*8;
  scheduleSave();rq();refreshLayers();
}

/* ================= persistence ================= */
const DB={db:null,
 open(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open('thumbsmith',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('meta',{keyPath:'id'});d.createObjectStore('data',{keyPath:'id'});};r.onsuccess=()=>{this.db=r.result;res();};r.onerror=()=>rej(r.error);});},
 req(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode),s=t.objectStore(store),r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});},
 put(store,rec){return this.req(store,'readwrite',s=>s.put(rec));},
 get(store,id){return this.req(store,'readonly',s=>s.get(id));},
 del(store,id){return this.req(store,'readwrite',s=>s.delete(id));},
 list(){if(!this.db)return Promise.resolve([]);return this.req('meta','readonly',s=>s.getAll()).then(a=>(a||[]).sort((x,y)=>y.updated-x.updated));}
};
let saveTimer=0,saving=false,savePending=false;
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,1800);}
const blobOf=c=>new Promise(r=>c.toBlob(b=>r(b),'image/png'));
async function saveNow(){
  clearTimeout(saveTimer);if(!DB.db||!S.id)return;
  if(saving){savePending=true;return;}
  saving=true;
  try{
    const layers=[];
    for(const L of S.layers){
      if(L.dirty||!L.blob){L.blob=await blobOf(L.canvas);L.dirty=false;}
      layers.push({name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,blob:L.blob});
    }
    await DB.put('data',{id:S.id,w:S.W,h:S.H,paper:S.paper,active:S.active,layers});
    const fl=flatten(false),k=220/Math.max(S.W,S.H),t=mk(Math.round(S.W*k),Math.round(S.H*k));
    t.getContext('2d').drawImage(fl,0,0,t.width,t.height);
    await DB.put('meta',{id:S.id,name:S.name,w:S.W,h:S.H,updated:Date.now(),thumb:t.toDataURL('image/jpeg',.8)});
    localStorage.setItem('ts_last',S.id);
  }catch(e){/* storage may be unavailable */}
  saving=false;if(savePending){savePending=false;saveNow();}
}
async function loadProject(id){

  S.W=d.w;S.H=d.h;S.paper=d.paper||'#ffffff';S.id=id;S.name=m?m.name:'Drawing';
  const layers=[];
  S.layers=[];ensureBuffers();
  for(const ld of d.layers){
    const L=newLayer(ld.name);L.visible=ld.visible;L.opacity=ld.opacity;L.blend=ld.blend||'source-over';
    try{const bmp=await createImageBitmap(ld.blob);L.ctx.drawImage(bmp,0,0);if(bmp.close)bmp.close();}catch(e){}
    L.blob=ld.blob;L.dirty=false;layers.push(L);
  }
  S.layers=layers.length?layers:[newLayer('Layer 1')];S.active=clamp(d.active||0,0,S.layers.length-1);
  clearHist();fitView();rq();localStorage.setItem('ts_last',id);return true;
}
async function exportProjectBlob(id){
  try{
    if(id===S.id){return await new Promise(r=>flatten(false).toBlob(r,'image/png'));}
    const d=await DB.get('data',id);if(!d)return null;
    const c=mk(d.w,d.h),x=c.getContext('2d');
    if(d.paper&&d.paper!=='transparent'){x.fillStyle=d.paper;x.fillRect(0,0,d.w,d.h);}else{x.fillStyle='#fff';x.fillRect(0,0,d.w,d.h);}
    for(const ld of d.layers){if(!ld.visible)continue;const bmp=await createImageBitmap(ld.blob);x.save();x.globalAlpha=ld.opacity;x.globalCompositeOperation=ld.blend||'source-over';x.drawImage(bmp,0,0);x.restore();if(bmp.close)bmp.close();}
    return await new Promise(r=>c.toBlob(r,'image/png'));
  }catch(e){return null;}
}

<script>
(()=>{
'use strict';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- save ---------- */

/* ---------- geometry ---------- */
const hyp=Math.hypot;
function resample(p,n,closed){
  const q=closed?[...p,p[0]]:p,cum=[0];
  for(let i=1;i<q.length;i++)cum.push(cum[i-1]+hyp(q[i][0]-q[i-1][0],q[i][1]-q[i-1][1]));
  const L=cum[cum.length-1],out=[];let j=1;
  for(let i=0;i<n;i++){
    const t=closed?i/n*L:(n>1?i/(n-1)*L:0);
    while(j<cum.length-1&&cum[j]<t)j++;
    const a=q[j-1],b=q[j],sl=cum[j]-cum[j-1]||1,u=clamp((t-cum[j-1])/sl,0,1);
    out.push([a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u]);
  }
  return out;
}
const plen=(p,closed)=>{let L=0;for(let i=1;i<p.length;i++)L+=hyp(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(closed&&p.length)L+=hyp(p[0][0]-p[p.length-1][0],p[0][1]-p[p.length-1][1]);return L;};
const dense=(p,closed,step=6)=>resample(p,Math.max(8,Math.ceil(plen(p,closed)/step)),closed);
const param=(n,f)=>Array.from({length:n},(_,i)=>f(i/n));
const SHAPES=[
 {name:'Circle',closed:true,pts:param(240,t=>[500+320*Math.cos(t*6.2832-1.5708),500+320*Math.sin(t*6.2832-1.5708)])},
 {name:'Square',closed:true,pts:[[190,190],[810,190],[810,810],[190,810]]},
 {name:'Triangle',closed:true,pts:[[500,150],[860,800],[140,800]]},
 {name:'Diamond',closed:true,pts:[[500,110],[860,500],[500,890],[140,500]]},
 {name:'Heart',closed:true,pts:param(300,t=>{const a=t*6.2832;return [500+19.5*16*Math.pow(Math.sin(a),3)*.98,455-19.5*(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*.98];})},
 {name:'Star',closed:true,pts:Array.from({length:10},(_,i)=>{const a=-1.5708+i*Math.PI/5,r=i%2?160:350;return [500+Math.cos(a)*r,520+Math.sin(a)*r];})},
 {name:'Wave',closed:false,pts:param(200,t=>[100+800*t,500+170*Math.sin(t*12.566)])},

function minD2(p,arr){let m=1e12;for(let i=0;i<arr.length;i++){const dx=arr[i][0]-p[0],dy=arr[i][1]-p[1],d=dx*dx+dy*dy;if(d<m)m=d;}return m;}
function scorePath(T,drawn,tol){
  const Dp=resample(drawn,Math.max(10,Math.ceil(plen(drawn,false)/6)),false),t2=tol*tol;
  if(Dp.length<10)return {score:0,precision:0,cover:0};
  let ok=0;for(const p of Dp)if(minD2(p,Dp.length?T:T)<=t2)ok++;
  let cv=0;for(const q of T)if(minD2(q,Dp)<=t2)cv++;
  const pr=ok/Dp.length,co=cv/T.length;

function mkTrace(level,memory){

    dbg:()=>({M,s,e}),

          const stars=elapsed<=par?3:elapsed<=par*1.7?2:1;const prev=D.maze.best[level];if(!prev||elapsed<prev)D.maze.best[level]=+elapsed.toFixed(1);

}

  function newGoal(){const s=Math.floor(Math.random()*4),r=Math.random()*N;goal=s===0?[r,0]:s===1?[r,N]:s===2?[0,r]:[N,r];lastGoal=t;}

  let drawing=false,pen=null,lastp=null;
  const toW=p=>{const off=(N-Ncam)/2,u=1000/Ncam;return [p[0]/u+off,p[1]/u+off];};
  const nearAnt=w=>hyp(w[0]-ax,w[1]-ay)<SAFE;
  function pick(){
    const cx=Math.floor(ax),cy=Math.floor(ay),cur=cy*N+cx;
    if(vis[cur]>=4&&t-lastGoal>1.5)newGoal();
    let best=1e9,bx=cx,by=cy;
    for(const [dx,dy] of D4){const nx=cx+dx,ny=cy+dy;if(!inb(nx,ny)||wall[ny*N+nx])continue;
      const same=Math.abs(Math.cos(ang)*dx+Math.sin(ang)*dy)>.9&&(Math.cos(ang)*dx+Math.sin(ang)*dy)>0;
      const s=vis[ny*N+nx]*2.2+hyp(nx+.5-goal[0],ny+.5-goal[1])*.5+Math.random()*.6-(same?.4:0);
      if(s<best){best=s;bx=nx;by=ny;}}
    tx=bx;ty=by;
  }
  function lose(){
    fin=true;antCarry={level,strokes};
    showResult({title:'The ant got away!',big:Math.round(t)+'s',sub:'It made it off the paper. Your walls stay, so add more and try again!',buttons:[{label:'Try again',pri:true,fn:retry},{label:'Wipe paper',fn:()=>{antCarry=null;retry();}},{label:'Menu',fn:toMenu}]});
  }
  function win(trapped){
    fin=true;antCarry={level,strokes};
    const stars=trapped?3:(minEdge>=6?2:1);
    complete('ant',level,stars,trapped?'You trapped the ant! It has nowhere to go.':'The ant got tired and wandered home.<br>Next round the paper grows and your maze stays.',trapped?'Trapped!':Math.round(t)+'s');
  }
  function arrive(){
    const cx=tx,cy=ty;ax=cx+.5;ay=cy+.5;vis[cy*N+cx]+=1;
    minEdge=Math.min(minEdge,cx,cy,N-1-cx,N-1-cy);
    if(cx===0||cy===0||cx===N-1||cy===N-1){lose();return;}
    pick();
  }
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  return {
    hint:'Draw walls with your finger — the ant is trying to leave the paper! Keep it in until the timer ends, or trap it.',
    info:()=>fin?'':(wait>0?'Ready…':Math.max(0,Math.ceil(T-t))+'s'),
    dbg:()=>({N,T,get t(){return t;},set t(v){t=v;},get ax(){return ax;},get ay(){return ay;},get ink(){return ink;},strokes,wall,get fin(){return fin;},SAFE,get wait(){return wait;},set wait(v){wait=v;},get animT(){return animT;}}),
    down(p){
      if(fin||animT<1)return;drawing=true;const w=toW(p);
      if(nearAnt(w)||ink<=0){pen=null;return;}
      pen=[w];strokes.push(pen);lastp=w;mark(w[0],w[1],.95);
    },
    move(p){
      if(!drawing||fin||animT<1)return;const w=toW(p);
      if(nearAnt(w)){pen=null;return;}
      if(!pen){if(ink<=0)return;pen=[w];strokes.push(pen);lastp=w;mark(w[0],w[1],.95);return;}
      const d=hyp(w[0]-lastp[0],w[1]-lastp[1]);if(d<.35)return;
      if(ink<d)return;ink-=d;pen.push(w);rasterSeg(lastp,w);lastp=w;
    },
    up(){drawing=false;pen=null;},
    upd(dt){
      if(fin)return;
      if(animT<1){animT=Math.min(1,animT+dt/1.8);Ncam=prevN+(N-prevN)*ease(animT);return;}
      Ncam=N;ink=Math.min(MAXINK,ink+REGEN*dt);
      if(wait>0){wait-=dt;return;}
      t+=dt;ph+=dt*13;trailT+=dt;
      if(trailT>.12){trailT=0;trail.push([ax,ay]);if(trail.length>90)trail.shift();}
      /* retarget if the target became a wall */
      const cx=Math.floor(ax),cy=Math.floor(ay);
      if(wall[ty*N+tx]){tx=cx;ty=cy;if(wall[cy*N+cx]){/* ant is inside a wall: find a free neighbor */let ok=false;for(const [dx,dy] of D4){const nx=cx+dx,ny=cy+dy;if(inb(nx,ny)&&!wall[ny*N+nx]){tx=nx;ty=ny;ok=true;break;}}if(!ok){}}else pick();}
      let rem=SPEED*dt,guard=0;
      while(rem>0&&guard++<6){
        const dx=tx+.5-ax,dy=ty+.5-ay,d=hyp(dx,dy);
        if(d>.02){const a=Math.atan2(dy,dx);let da=a-ang;while(da>Math.PI)da-=6.2832;while(da<-Math.PI)da+=6.2832;ang+=da*Math.min(1,dt*10);}
        if(d<=rem){ax=tx+.5;ay=ty+.5;rem-=d;arrive();if(fin)return;if(tx===Math.floor(ax)&&ty===Math.floor(ay))break;}
        else{ax+=dx/d*rem;ay+=dy/d*rem;rem=0;}
      }
      trapChk+=dt;
      if(trapChk>.5){trapChk=0;if(!escapable(Math.floor(ax),Math.floor(ay))){win(true);return;}}
      if(t>=T)win(false);
    },
    draw(c){
      const u=1000/Ncam,off=(N-Ncam)/2;
      c.save();c.scale(u,u);c.translate(-off,-off);
      /* paper grid dots */
      c.fillStyle='#e4e0d2';for(let y=5;y<N;y+=5)for(let x=5;x<N;x+=5){c.fillRect(x-.06,y-.06,.12,.12);}
      /* tape lines for earlier, smaller sheets */
      c.save();c.strokeStyle='#cfc9b6';c.lineWidth=Math.max(.12,2/u);c.setLineDash([.8,.6]);
      for(let k=1;k<level;k++){const n=50+14*(k-1),o=(N-n)/2;c.strokeRect(o,o,n,n);}c.restore();
      /* walls */
      c.strokeStyle='#2b2b44';c.fillStyle='#2b2b44';c.lineWidth=1.7;c.lineCap=c.lineJoin='round';
      for(const s of strokes){if(s.length===1){c.beginPath();c.arc(s[0][0],s[0][1],.85,0,6.3);c.fill();continue;}c.beginPath();s.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.stroke();}
      /* trail */
      if(trail.length>1){c.strokeStyle='#d9a98c88';c.lineWidth=.35;c.beginPath();trail.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.lineTo(ax,ay);c.stroke();}
      /* safe-zone ring while ready */
      if(!fin&&animT>=1){c.strokeStyle='#ff7a5944';c.lineWidth=.2;c.setLineDash([.6,.5]);c.beginPath();c.arc(ax,ay,SAFE,0,6.3);c.stroke();c.setLineDash([]);}
      /* ant */
      c.save();c.translate(ax,ay);c.rotate(ang);
      c.strokeStyle='#2a1a12';c.lineWidth=.16;c.lineCap='round';
      for(let i=0;i<3;i++){const bx=.55-i*.5,sw=Math.sin(ph+i*2.1)*.4;for(const sd of [-1,1]){const s2=sd*(i%2?-1:1);c.beginPath();c.moveTo(bx,0);c.lineTo(bx+sw*s2*.8,sd*.85);c.lineTo(bx+sw*s2*.8+.3,sd*1.2);c.stroke();}}
      c.fillStyle='#4a2616';c.beginPath();c.ellipse(-1,0,.85,.6,0,0,6.3);c.fill();
      c.beginPath();c.ellipse(.1,0,.5,.4,0,0,6.3);c.fill();
      c.fillStyle='#5b301c';c.beginPath();c.arc(.95,0,.42,0,6.3);c.fill();
      c.strokeStyle='#2a1a12';c.lineWidth=.12;c.beginPath();c.moveTo(1.2,-.15);c.quadraticCurveTo(1.7,-.6,2.1,-.35+Math.sin(ph*.6)*.1);c.moveTo(1.2,.15);c.quadraticCurveTo(1.7,.6,2.1,.35-Math.sin(ph*.6)*.1);c.stroke();
      c.fillStyle='#fff';c.beginPath();c.arc(1.1,-.17,.07,0,6.3);c.arc(1.1,.17,.07,0,6.3);c.fill();
      c.restore();
      c.restore();
      /* HUD */
      c.fillStyle='#e8e4d6';c.fillRect(60,955,880,22);
      const f=ink/MAXINK;c.fillStyle=f>.25?'#2f6bff':'#ef5350';c.fillRect(60,955,880*f,22);
      c.fillStyle='#555';c.font='600 20px system-ui';c.textAlign='left';c.textBaseline='middle';c.fillText('INK',68,966);
      if(!fin&&wait>0&&animT>=1){c.fillStyle='#ff7a59';c.font='700 44px system-ui';c.textAlign='center';c.fillText('Draw walls! Ant starts in '+Math.ceil(wait),500,90);}
      if(animT<1){c.fillStyle='#ff7a59';c.font='700 44px system-ui';c.textAlign='center';c.fillText('The paper grows!',500,90);}
    }
  };
}

/* ---------- play loop ---------- */
function startGame(id,level){
  cur={id,level,g:MAKERS[id](level)};
  title.textContent=gdef(id).name+(gdef(id).levels?' • '+level:'');
  hint.textContent=cur.g.hint;resEl.hidden=true;parts=[];measure();
}
let raf=0,lastT=0;
function startLoop(){if(raf)return;lastT=performance.now();raf=requestAnimationFrame(loop);}
function loop(t){
  raf=0;if(!open)return;
  const dt=Math.min(.05,(t-lastT)/1000);lastT=t;
  pollPad(t,dt);
  if(cur&&cur.g.upd&&resEl.hidden&&!play.hidden)cur.g.upd(dt);
  if(cur&&!play.hidden&&B.w){
    const c=cx;c.setTransform(B.dpr,0,0,B.dpr,0,0);c.clearRect(0,0,B.w,B.h);
    c.save();c.translate(B.ox,B.oy);c.scale(B.k,B.k);
    c.save();c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=20;c.fillStyle='#fbfaf6';c.beginPath();c.roundRect?c.roundRect(0,0,1000,1000,24):c.rect(0,0,1000,1000);c.fill();c.restore();
    c.save();c.beginPath();c.rect(0,0,1000,1000);c.clip();cur.g.draw(c);c.restore();c.restore();
    info.textContent=cur.g.info?cur.g.info():'';
    if(parts.length){c.setTransform(B.dpr,0,0,B.dpr,0,0);
      parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;c.save();c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.w/2,-3,p.w,6);c.restore();});
      parts=parts.filter(p=>p.y<B.h+30);}
  }
  raf=requestAnimationFrame(loop);
}
/* input */
let pid=null;
const gDown=p=>{if(cur&&resEl.hidden)cur.g.down(p);};
const gMove=p=>{if(cur&&resEl.hidden)cur.g.move(p);};
const gUp=()=>{if(cur&&resEl.hidden)cur.g.up();};
cv.addEventListener('pointerdown',e=>{e.preventDefault();if(pid!==null)return;pid=e.pointerId;try{cv.setPointerCapture(pid);}catch(_){}const r=cv.getBoundingClientRect();gDown(toBoard(e.clientX-r.left,e.clientY-r.top));});
cv.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;e.preventDefault();const r=cv.getBoundingClientRect();const list=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];(list.length?list:[e]).forEach(ev=>gMove(toBoard(ev.clientX-r.left,ev.clientY-r.top)));});
const endP=e=>{if(e.pointerId!==pid)return;pid=null;gUp();};
cv.addEventListener('pointerup',endP);cv.addEventListener('pointercancel',endP);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- gamepad ---------- */
let pcx=0,pcy=0,padDown=false,padSeen=false,prev={},navT=0,fidx=-1;
function focusables(){
  const scope=!resEl.hidden?resEl:hub.hidden?root:hub;
  const list=[...scope.querySelectorAll('button:not([disabled])')].filter(b=>b.offsetParent!==null);
  const back=$('#gBack');if(scope!==root&&!list.includes(back))list.unshift(back);return list;
}
function pollPad(t,dt){
  const gps=(navigator.getGamepads?navigator.getGamepads():[])||[];const gp=[...gps].find(g=>g&&g.connected);
  if(!gp){curEl.style.display='none';return;}
  const b=i=>!!(gp.buttons[i]&&gp.buttons[i].pressed),edge=i=>{const n=b(i),o=prev[i];prev[i]=n;return n&&!o;};
  const lx=Math.abs(gp.axes[0])>.2?gp.axes[0]:0,ly=Math.abs(gp.axes[1])>.2?gp.axes[1]:0;
  const dx=lx+(b(15)?1:0)-(b(14)?1:0),dy=ly+(b(13)?1:0)-(b(12)?1:0);
  const A=b(0),eA=edge(0),eB=edge(1);edge(12);edge(13);edge(14);edge(15);
  if(dx||dy||A)padSeen=true;
  const playing=cur&&!play.hidden&&resEl.hidden;
  if(playing){
    if(!pcx&&!pcy){pcx=B.w/2;pcy=B.h/2;}
    pcx=clamp(pcx+dx*560*dt,0,B.w);pcy=clamp(pcy+dy*560*dt,0,B.h);
    curEl.style.display=padSeen?'block':'none';curEl.style.left=pcx+'px';curEl.style.top=pcy+'px';
    const p=toBoard(pcx,pcy);
    if(A&&!padDown){padDown=true;gDown(p);}else if(A&&padDown)gMove(p);else if(!A&&padDown){padDown=false;gUp();}
    if(eB){padDown=false;history.back();}
  }else{
    curEl.style.display='none';
    if(padDown){padDown=false;}
    const L=focusables();if(!L.length)return;
    let step=0;
    if(t>navT){if(dy>.5||dx>.5){step=1;}else if(dy<-.5||dx<-.5){step=-1;}if(step)navT=t+190;}
    if(step||fidx<0||!L.includes(document.activeElement)){if(step){const i=L.indexOf(document.activeElement);fidx=(i<0?(step>0?0:L.length-1):(i+step+L.length)%L.length);}else if(fidx<0||fidx>=L.length)fidx=0;L[fidx].focus({preventScroll:false});if(L[fidx].scrollIntoView)L[fidx].scrollIntoView({block:'nearest'});}
    if(eA&&document.activeElement&&L.includes(document.activeElement))document.activeElement.click();
    if(eB)history.back();
  }
}

/* ---------- hidden debug panel ---------- */
let taps=[];
function tapTitle(){
  title.onclick=()=>{
    const now=Date.now();taps=taps.filter(x=>now-x<2500);taps.push(now);
    if(taps.length>=5&&nav.length===1){taps=[];askCode();}
  };
}
function modal(html){const m=el('div','gdbg',`<div class="gdbox">${html}</div>`);root.appendChild(m);return m;}
function askCode(){
  const m=modal(`<b>Enter code</b><input id="gCode" inputmode="numeric" class="num" style="width:100%;margin:10px 0" autocomplete="off"><div class="row"><button class="btn" id="gcX">Cancel</button><button class="btn pri" id="gcOk">OK</button></div>`);
  $('#gcX',m).onclick=()=>m.remove();
  $('#gcOk',m).onclick=()=>{if($('#gCode',m).value.trim()==='2057'){m.remove();debugPanel();}else{m.remove();}};
  setTimeout(()=>$('#gCode',m).focus(),50);
}
function debugPanel(){
  const m=modal(`<b>Debug</b><div class="hint" style="margin:6px 0">Jump anywhere, unlock everything, or see each ending.</div><div id="gdl"></div><div class="row" style="margin-top:12px"><button class="btn" id="gdAll">Unlock all levels</button><button class="btn" id="gdReset">Reset progress</button><button class="btn pri" id="gdX">Close</button></div>`);
  const l=$('#gdl',m);
  GAMES.forEach(g=>{const r=el('div','row',`<b style="min-width:120px;font-size:13px">${g.name}</b>`);r.style.marginBottom='6px';
    const e=el('button','chip','Show ending');e.onclick=()=>{m.remove();const gm=g.id;if(nav[nav.length-1].t!=='play'){push({t:'play',id:gm,level:1});}setTimeout(()=>showEnding(gm),150);};r.appendChild(e);
    if(g.levels){const j=el('button','chip','Level 1→'+g.levels);j.onclick=()=>{m.remove();push({t:'levels',id:g.id});};r.appendChild(j);}
    l.appendChild(r);});
  $('#gdAll',m).onclick=()=>{GAMES.forEach(g=>{if(g.levels)D[g.id].unlocked=g.levels;});save();renderHub();m.remove();};
  $('#gdReset',m).onclick=()=>{if(confirm('Erase all game progress?')){D=DEF();save();renderHub();m.remove();}};
  $('#gdX',m).onclick=()=>m.remove();
}
window.__g={get cur(){return cur;},get D(){return D;},showEnding,SHAPES,scorePath,get B(){return B;},get nav(){return nav;},push,debugPanel,askCode};
})();
